<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam & CS.RIN.RU App Lookup</title>
    <link rel="icon" href="data:,">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #242424;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 24px;
            text-align: center;
            color: #ffffff;
            margin-bottom: 25px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #3d3d3d;
            border-radius: 4px;
            background-color: #1a1a1a;
            color: #ffffff;
            font-size: 16px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #4a90e2;
        }
        button {
            padding: 12px 24px;
            background-color: #4a90e2;
            border: none;
            border-radius: 4px;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #357abd;
        }
        .loading {
            text-align: center;
            color: #888;
        }
        .results-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .game-card {
            display: flex;
            background-color: #1c1c1c;
            border: 1px solid #2d2d2d;
            border-radius: 6px;
            padding: 15px;
            gap: 15px;
            align-items: center;
        }
        .game-card img {
            width: 120px;
            height: 45px;
            object-fit: cover;
            border-radius: 4px;
        }
        .game-info {
            flex: 1;
        }
        .game-info h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: #ffffff;
        }
        .game-info p {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #888;
        }
        .actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .btn-link {
            text-decoration: none;
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            transition: background-color 0.2s, opacity 0.2s;
            text-align: center;
        }
        .btn-link:hover {
            opacity: 0.9;
        }
        .btn-rin {
            background-color: #d9534f;
        }
        .btn-rin-checking {
            background-color: #e0a800;
            cursor: wait;
        }
        .btn-rin-found {
            background-color: #2ca05a !important;
        }
        .btn-rin-nocrack {
            background-color: #555555 !important;
            cursor: not-allowed;
            opacity: 0.6;
            pointer-events: none;
        }
        .btn-rin-error {
            background-color: #9c27b0 !important;
            cursor: not-allowed;
            opacity: 0.8;
            pointer-events: none;
        }
        .btn-db {
            background-color: #1f3d5a;
        }
        .error {
            color: #ff6b6b;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Game Lookup Tool</h1>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Enter game name..." onkeypress="handleKeyPress(event)">
        <button onclick="searchGame()">Search</button>
    </div>
    
    <div id="results" class="results-container"></div>
</div>

<script>
    // ==========================================
    // PASTE YOUR CLOUDFLARE WORKER URL HERE
    // Example: "https://my-proxy.myname.workers.dev"
    // Leave empty ("") to only use the public codetabs proxy.
    // ==========================================
    const MY_PRIVATE_PROXY = "https://steam-cors-api.geminicli9988.workers.dev"; 

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            searchGame();
        }
    }

    async function fetchCORS(url) {
        const encodedUrl = encodeURIComponent(url);
        const proxyUrls = [];

        // 1. Prioritize your private proxy if you set one up
        if (MY_PRIVATE_PROXY) {
            // Remove trailing slash if accidentally included
            const cleanProxy = MY_PRIVATE_PROXY.replace(/\/$/, ""); 
            proxyUrls.push(`${cleanProxy}/?url=${encodedUrl}`);
        }

        // 2. Public Fallback Proxy (Will work sometimes, but may get rate limited)
        proxyUrls.push(`https://api.codetabs.com/v1/proxy?quest=${encodedUrl}`);

        let lastError;

        for (const proxy of proxyUrls) {
            try {
                const response = await fetch(proxy);
                if (!response.ok) throw new Error(`Proxy responded with status: ${response.status}`);
                return await response.text();
            } catch (error) {
                console.warn(`Proxy failed (${proxy}):`, error.message);
                lastError = error;
            }
        }

        throw lastError;
    }

    async function searchGame() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;

        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '<div class="loading">Searching Steam catalog...</div>';

        try {
            const steamApiUrl = `https://store.steampowered.com/api/storesearch/?term=${encodeURIComponent(query)}&l=english&cc=US`;
            
            const textData = await fetchCORS(steamApiUrl);
            const data = JSON.parse(textData);

            if (!data || !data.items || data.items.length === 0) {
                resultsDiv.innerHTML = '<div class="loading">No matches found. Check spelling.</div>';
                return;
            }

            resultsDiv.innerHTML = '';

            data.items.forEach((item, index) => {
                const gameCard = document.createElement('div');
                gameCard.className = 'game-card';
                const dbUrl = `https://steamdb.info/app/${item.id}/`;

                gameCard.innerHTML = `
                    <img src="${item.tiny_image}" alt="${item.name}">
                    <div class="game-info">
                        <h3>${item.name}</h3>
                        <p>App ID: <code>${item.id}</code></p>
                        <div class="actions">
                            <a href="#" class="btn-link btn-rin-checking" id="rin-btn-${item.id}">Checking...</a>
                            <a href="${dbUrl}" target="_blank" class="btn-link btn-db">SteamDB</a>
                        </div>
                    </div>
                `;
                resultsDiv.appendChild(gameCard);

                setTimeout(() => {
                    verifyOnRin(item.id, item.name);
                }, index * 1000); 
            });

        } catch (error) {
            console.error(error);
            resultsDiv.innerHTML = '<div class="error">Failed to fetch data. Ensure proxy is working.</div>';
        }
    }

    async function verifyOnRin(appId, appName) {
        const rinBtn = document.getElementById(`rin-btn-${appId}`);
        if (!rinBtn) return;
        
        const rinSearchUrl = `https://cs.rin.ru/forum/search.php?keywords=${appId}&fid%5B%5D=10&sr=topics&sf=firstpost`;

        try {
            const text = await fetchCORS(rinSearchUrl);
            
            if (!text) throw new Error("Empty response from proxy.");

            const doc = new DOMParser().parseFromString(text, "text/html");
            
            // Check if Cloudflare blocked the proxy
            const securityCheck = doc.querySelector("title");
            if (securityCheck && securityCheck.textContent.includes("Just a moment")) {
                rinBtn.innerText = "Proxy Blocked";
                rinBtn.className = "btn-link btn-rin-error";
                rinBtn.title = "Cloudflare blocked the proxy. Set up a private Cloudflare worker.";
                return;
            }

            const topics = doc.querySelectorAll(".titles:not(:first-child), .topictitle");

            if (topics && topics.length > 0) {
                let matchedTopic = null;
                for (let topic of topics) {
                    if (topic.textContent.toLowerCase().includes(appName.toLowerCase())) {
                        matchedTopic = topic;
                        break;
                    }
                }
                if (!matchedTopic) matchedTopic = topics[0];

                const href = matchedTopic.getAttribute("href");
                const directUrl = "https://cs.rin.ru/forum/" + href.split("&hilit")[0];

                rinBtn.href = directUrl;
                rinBtn.target = "_blank";
                rinBtn.innerText = "View on CS.RIN.RU";
                rinBtn.className = "btn-link btn-rin-found";
            } else {
                setNoCrack(rinBtn);
            }
        } catch (error) {
            console.log(`Verification failed for App ID ${appId}: ${error.message}`);
            rinBtn.innerText = "Check Failed";
            rinBtn.className = "btn-link btn-rin-error";
            rinBtn.removeAttribute("href");
            rinBtn.removeAttribute("target");
            rinBtn.title = "Proxy server failed to fetch data";
        }
    }

    function setNoCrack(rinBtn) {
        rinBtn.innerText = "Not Found";
        rinBtn.className = "btn-link btn-rin-nocrack";
        rinBtn.removeAttribute("href");
        rinBtn.removeAttribute("target");
    }
</script>

</body>
</html>
