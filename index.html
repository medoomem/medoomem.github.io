<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam & CS.RIN.RU App Lookup</title>
    <link rel="icon" href="data:,">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1a1a1a; color: #e0e0e0; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background-color: #242424; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { font-size: 24px; text-align: center; color: #ffffff; margin-bottom: 25px; }
        .banner { background-color: #3a2222; border: 1px solid #ff6b6b; color: #ff8b8b; padding: 15px; border-radius: 6px; margin-bottom: 25px; text-align: center; font-size: 14px; display: none; }
        .search-box { display: flex; gap: 10px; margin-bottom: 30px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #3d3d3d; border-radius: 4px; background-color: #1a1a1a; color: #ffffff; font-size: 16px; }
        button { padding: 12px 24px; background-color: #4a90e2; border: none; border-radius: 4px; color: #ffffff; font-size: 16px; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #357abd; }
        .loading { text-align: center; color: #888; }
        .results-container { display: flex; flex-direction: column; gap: 15px; }
        .game-card { display: flex; background-color: #1c1c1c; border: 1px solid #2d2d2d; border-radius: 6px; padding: 15px; gap: 15px; align-items: center; }
        .game-card img { width: 120px; height: 45px; object-fit: cover; border-radius: 4px; }
        .game-info { flex: 1; }
        .game-info h3 { margin: 0 0 5px 0; font-size: 18px; color: #ffffff; }
        .game-info p { margin: 0 0 10px 0; font-size: 14px; color: #888; }
        .actions { display: flex; gap: 12px; align-items: center; }
        .btn-link { text-decoration: none; padding: 8px 14px; font-size: 13px; border-radius: 4px; color: white; font-weight: bold; text-align: center; }
        .btn-rin-checking { background-color: #e0a800; cursor: wait; }
        .btn-rin-found { background-color: #2ca05a !important; }
        .btn-rin-nocrack { background-color: #555555 !important; cursor: not-allowed; opacity: 0.6; }
        .btn-db { background-color: #1f3d5a; }
        .error { color: #ff6b6b; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>Game Lookup Tool</h1>
    
    <div id="companionBanner" class="banner">
        ⚠️ <strong>Python Proxy Offline!</strong><br> Ensure your local <code>server.py</code> script is running in your terminal to search and fetch links.
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Enter game name..." onkeypress="handleKeyPress(event)">
        <button onclick="searchGame()">Search</button>
    </div>
    
    <div id="results" class="results-container"></div>
</div>

<script>
    let ws;
    const pendingRequests = new Map();

    function handleKeyPress(event) { if (event.key === 'Enter') searchGame(); }

    function connectWebSocket() {
        ws = new WebSocket("ws://localhost:8765");
        
        ws.onopen = () => {
            document.getElementById('companionBanner').style.display = 'none';
        };
        
        ws.onclose = () => {
            document.getElementById('companionBanner').style.display = 'block';
            setTimeout(connectWebSocket, 3000); 
        };
        
        ws.onmessage = (event) => {
            try {
                const response = JSON.parse(event.data);
                const { requestId, data, error } = response;
                
                if (pendingRequests.has(requestId)) {
                    const { resolve, reject } = pendingRequests.get(requestId);
                    pendingRequests.delete(requestId);
                    
                    if (error) reject(new Error(error));
                    else resolve(data);
                }
            } catch (err) {
                console.error(err);
            }
        };
    }

    async function fetchViaPython(url) {
        return new Promise((resolve, reject) => {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                reject(new Error("Server offline"));
                return;
            }
            
            const requestId = Math.random().toString(36).substring(2);
            pendingRequests.set(requestId, { resolve, reject });
            
            ws.send(JSON.stringify({ requestId, url }));
            
            setTimeout(() => {
                if (pendingRequests.has(requestId)) {
                    pendingRequests.delete(requestId);
                    reject(new Error("Timeout"));
                }
            }, 15000);
        });
    }

    connectWebSocket();

    async function searchGame() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;

        const resultsDiv = document.getElementById('results');
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            resultsDiv.innerHTML = '<div class="error">Search failed: Python backend proxy is offline.</div>';
            return;
        }

        resultsDiv.innerHTML = '<div class="loading">Searching Steam catalog...</div>';

        try {
            const steamApiUrl = `https://store.steampowered.com/api/storesearch/?term=${encodeURIComponent(query)}&l=english&cc=US`;
            const textData = await fetchViaPython(steamApiUrl);
            const data = JSON.parse(textData);

            if (!data || !data.items || data.items.length === 0) {
                resultsDiv.innerHTML = '<div class="loading">No matches found. Check spelling.</div>';
                return;
            }

            resultsDiv.innerHTML = '';

            // We only check the top 3 matches to prevent CS.RIN forum flood bans
            const maxChecks = Math.min(data.items.length, 100);

            data.items.forEach((item, index) => {
                const gameCard = document.createElement('div');
                gameCard.className = 'game-card';
                
                // If it is beyond the top 3, we don't auto-check it (user can click SteamDB to check manually)
                const isAutoCheck = index < maxChecks;
                const rRinText = isAutoCheck ? "Checking..." : "Search on SteamDB";
                const rRinClass = isAutoCheck ? "btn-link btn-rin-checking" : "btn-link btn-rin-nocrack";

                gameCard.innerHTML = `
                    <img src="${item.tiny_image}" alt="${item.name}">
                    <div class="game-info">
                        <h3>${item.name}</h3>
                        <p>App ID: <code>${item.id}</code></p>
                        <div class="actions">
                            <a href="#" class="${rRinClass}" id="rin-btn-${item.id}">${rRinText}</a>
                            <a href="https://steamdb.info/app/${item.id}/" target="_blank" class="btn-link btn-db">SteamDB</a>
                        </div>
                    </div>
                `;
                resultsDiv.appendChild(gameCard);

                // Stagger requests by 5 seconds (5000ms) to respect the forum's flood control
                if (isAutoCheck) {
                    setTimeout(() => { verifyOnRin(item.id, item.name); }, index * 500);
                } else {
                    // Make the button clickable to search manually if desired
                    const manualBtn = document.getElementById(`rin-btn-${item.id}`);
                    manualBtn.style.pointerEvents = "auto";
                    manualBtn.style.cursor = "pointer";
                    manualBtn.href = `https://cs.rin.ru/forum/search.php?keywords=${item.id}&fid%5B%5D=10&sr=topics&sf=firstpost`;
                    manualBtn.target = "_blank";
                }
            });
        } catch (error) {
            resultsDiv.innerHTML = '<div class="error">Failed to fetch data. Check Python script logs.</div>';
        }
    }

    async function verifyOnRin(appId, appName) {
        const rinBtn = document.getElementById(`rin-btn-${appId}`);
        if (!rinBtn) return;
        
        const rinSearchUrl = `https://cs.rin.ru/forum/search.php?keywords=${appId}&fid%5B%5D=10&sr=topics&sf=firstpost`;

        try {
            const text = await fetchViaPython(rinSearchUrl);
            const doc = new DOMParser().parseFromString(text, "text/html");
            const topics = doc.querySelectorAll(".titles:not(:first-child), .topictitle");

            if (topics && topics.length > 0) {
                let matchedTopic = topics[0];
                for (let topic of topics) {
                    if (topic.textContent.toLowerCase().includes(appName.toLowerCase())) {
                        matchedTopic = topic; break;
                    }
                }
                const href = matchedTopic.getAttribute("href");
                rinBtn.href = "https://cs.rin.ru/forum/" + href.split("&hilit")[0];
                rinBtn.target = "_blank";
                rinBtn.innerText = "View on CS.RIN.RU";
                rinBtn.className = "btn-link btn-rin-found";
            } else {
                setNoCrack(rinBtn);
            }
        } catch (error) {
            setNoCrack(rinBtn);
        }
    }

    function setNoCrack(rinBtn) {
        rinBtn.innerText = "Not Found";
        rinBtn.className = "btn-link btn-rin-nocrack";
        rinBtn.removeAttribute("href");
        rinBtn.removeAttribute("target");
        rinBtn.style.pointerEvents = "none";
    }
</script>
</body>
</html>
